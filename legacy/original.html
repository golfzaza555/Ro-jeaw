function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }, [key, value]);
  return [value, setValue];
}

function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    o.start(); o.stop(ctx.currentTime + 0.32);
    o.onended = () => ctx.close();
  } catch (e) {}
}

function fmtCountdown(ms) {
  const overdue = ms < 0;
  const abs = Math.abs(ms);
  const totalSec = Math.floor(abs / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  const txt = `${m}:${String(s).padStart(2, '0')}`;
  return { overdue, txt };
}

/* ============================== CUSTOMER: STEP DOTS ============================== */
const STEP_LABELS = ['ไข่ & ฐาน', 'ท็อปปิ้ง', 'เวลารับ', 'สรุปออเดอร์'];
function StepDots({ step }) {
  return (
    <div className="flex items-center justify-center gap-2 mb-5">
      {STEP_LABELS.map((label, i) => {
        const n = i + 1;
        const active = n === step;
        const done = n < step;
        return (
          <div key={label} className="flex items-center gap-2">
            <div className="flex flex-col items-center gap-1">
              <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-colors duration-200 ${
                done ? 'bg-emerald-500 text-white' : active ? 'bg-amber-500 text-charcoal-900' : 'bg-charcoal-200 text-charcoal-500'
              }`}>
                {done ? <IconCheck size={14} /> : n}
              </div>
              <span className={`text-[10px] font-medium hidden sm:block ${active ? 'text-charcoal-800' : 'text-charcoal-400'}`}>{label}</span>
            </div>
            {n < STEP_LABELS.length && <div className={`w-5 sm:w-10 h-0.5 rounded ${done ? 'bg-emerald-400' : 'bg-charcoal-200'}`} />}
          </div>
        );
      })}
    </div>
  );
}

/* ============================== STEP 2: TOPPINGS ============================== */

/* ============================== STEP 3: PICKUP & CONTACT ============================== */
function StepPickup({ form, setForm }) {
  const setQuick = (min) => {
    const t = Date.now() + min * 60000;
    setForm((f) => ({ ...f, pickupQuick: min, pickupCustom: '', pickupTime: t }));
  };
  const setCustom = (value) => {
    let t = null;
    if (value) {
      const [h, m] = value.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
      t = d.getTime();
    }
    setForm((f) => ({ ...f, pickupQuick: null, pickupCustom: value, pickupTime: t }));
  };
  const addNote = (txt) => setForm((f) => ({ ...f, note: f.note ? `${f.note}, ${txt}` : txt }));

  return (
    <div className="animate-slideUp space-y-6">
      <section>
        <h3 className="font-bold text-lg mb-1">⏰ เวลารับอาหาร</h3>
        <p className="text-sm text-charcoal-400 mb-3">Pickup time</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {PICKUP_QUICK.map((min) => (
            <button
              key={min}
              onClick={() => setQuick(min)}
              className={`btn-press rounded-xl border-2 px-4 py-2.5 font-semibold text-sm ${
                form.pickupQuick === min ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-charcoal-200 bg-white hover:border-amber-300'
              }`}

            </button>
          ))}
        </div>
        <div className="flex items-center gap-2">
          <span className="text-sm text-charcoal-500">หรือเลือกเวลาเอง:</span>
          <input
            type="time"
            value={form.pickupCustom}
            onChange={(e) => setCustom(e.target.value)}
            className="rounded-xl border-2 border-charcoal-200 focus:border-amber-400 outline-none px-3 py-2 text-sm"
          />
        </div>
        {form.pickupTime && (
          <p className="text-sm text-emerald-600 font-semibold mt-2">
            ✅ รับได้ประมาณ {new Date(form.pickupTime).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.
          </p>
        )}
      </section>

      <section>
        <h3 className="font-bold text-lg mb-3">📇 ข้อมูลติดต่อ</h3>
        <div className="space-y-3">
          <div className="relative">
            <IconUser size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-charcoal-400" />
            <input
              value={form.name}
              onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))}
              placeholder="ชื่อลูกค้า"
              className="w-full rounded-xl border-2 border-charcoal-200 focus:border-amber-400 outline-none pl-10 pr-4 py-3 text-sm"
            />
          </div>
          <div className="relative">
            <IconPhone size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-charcoal-400" />
            <input
              value={form.phone}
              onChange={(e) => setForm((f) => ({ ...f, phone: e.target.value.replace(/[^0-9-]/g, '') }))}
              placeholder="เบอร์โทรศัพท์"
              className="w-full rounded-xl border-2 border-charcoal-200 focus:border-amber-400 outline-none pl-10 pr-4 py-3 text-sm"
            />
          </div>
          <div className="relative">
            <IconMessage size={16} className="absolute left-3.5 top-3.5 text-charcoal-400" />
            <textarea
              value={form.note}
              onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))}

                + {txt}

/* ============================== STICKY BAR ============================== */
function StickyBar({ step, setStep, pricing, canNext, onSubmit, submitting }) {
  return (
    <div className="fixed bottom-0 left-0 right-0 z-20 bg-white border-t-2 border-charcoal-100 shadow-[0_-8px_24px_-8px_rgba(0,0,0,0.12)]">
      <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
        {step > 1 && (
          <button onClick={() => setStep((s) => s - 1)} className="btn-press w-11 h-11 shrink-0 rounded-2xl border-2 border-charcoal-200 flex items-center justify-center text-charcoal-600">
            <IconChevronLeft size={20} />
          </button>
        )}
        <div className="flex-1 min-w-0">
          <p className="text-[11px] text-charcoal-400 leading-none">ยอดรวม{pricing.toppingCount > 0 ? ` · ท็อปปิ้ง ${pricing.toppingCount} รายการ` : ''}</p>
          <p className="text-lg font-extrabold text-amber-600 leading-tight truncate">{money(pricing.total)}</p>
        </div>
        {step < 4 ? (
          <PrimaryButton disabled={!canNext} onClick={() => setStep((s) => s + 1)} className="shrink-0">
            ถัดไป <IconChevronRight size={18} />
          </PrimaryButton>
        ) : (
          <PrimaryButton disabled={!canNext || submitting} onClick={onSubmit} className="shrink-0">
            {submitting ? 'กำลังส่ง...' : 'ยืนยันสั่งซื้อ'} <IconCheck size={18} />
          </PrimaryButton>
        )}
      </div>
    </div>
  );
}

/* ============================== CUSTOMER VIEW ============================== */
const emptyForm = () => ({
  eggId: 2, baseId: 'rice', styleId: 'standard', toppings: [],
  pickupQuick: 15, pickupCustom: '', pickupTime: Date.now() + 15 * 60000,
  name: '', phone: '', note: '',
});

function CustomerView({ storeOpen, stock, onPlaceOrder, toast }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState(emptyForm);
  const [confirmedOrder, setConfirmedOrder] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const pricing = useMemo(() => {
    const egg = EGG_OPTIONS.find((e) => e.id === form.eggId);
    const base = BASE_OPTIONS.find((b) => b.id === form.baseId);
    const toppingsTotal = form.toppings.reduce((sum, id) => sum + (TOPPING_MAP[id] ? TOPPING_MAP[id].price : 0), 0);
    const total = (egg ? egg.price : 0) + (base ? base.delta : 0) + toppingsTotal;
    return { total, toppingCount: form.toppings.length };
  }, [form]);

  const canNext = useMemo(() => {
    if (step === 1) return !!form.eggId && !!form.baseId && !!form.styleId;
    if (step === 2) return true;
    if (step === 3) return !!form.pickupTime && form.name.trim().length > 1 && form.phone.trim().length >= 9;
    if (step === 4) return storeOpen;
    return true;
  }, [step, form, storeOpen]);

  const handleSubmit = () => {
    setSubmitting(true);
    setTimeout(() => {
      const order = {
        id: `TS-0${Math.floor(100 + Math.random() * 800)}`,
        status: 'pending',
        name: form.name.trim(), phone: form.phone.trim(),
        eggId: form.eggId, baseId: form.baseId, styleId: form.styleId,
        toppings: form.toppings, note: form.note.trim(),
        total: pricing.total,
        createdAt: Date.now(), pickupTime: form.pickupTime, completedAt: null,
      };
      onPlaceOrder(order);
      setConfirmedOrder(order);
      setSubmitting(false);
    }, 500);
  };

  const resetAll = () => { setForm(emptyForm()); setStep(1); setConfirmedOrder(null); };

  if (!storeOpen) {
    return (
      <div className="max-w-md mx-auto px-4 py-20 text-center animate-fadeIn">
        <p className="text-6xl mb-4">🔒</p>
        <h2 className="text-2xl font-extrabold text-charcoal-800">ร้านปิดชั่วคราว</h2>
        <p className="text-charcoal-400 mt-2">ขออภัย ขณะนี้ยังไม่เปิดรับพรีออเดอร์<br />กรุณาลองใหม่อีกครั้งภายหลังนะคะ</p>
      </div>
    );
  }

  return (
    <div className="max-w-3xl mx-auto px-4 pt-6 pb-28">
      <StepDots step={step} />
      {step === 1 && <StepEggBase form={form} setForm={setForm} />}
      {step === 2 && <StepToppings form={form} setForm={setForm} stock={stock} />}
      {step === 3 && <StepPickup form={form} setForm={setForm} />}
      {step === 4 && <StepSummary form={form} pricing={pricing} />}

      <StickyBar step={step} setStep={setStep} pricing={pricing} canNext={canNext} onSubmit={handleSubmit} submitting={submitting} />
      <ConfirmModal order={confirmedOrder} onClose={() => setConfirmedOrder(null)} onAgain={resetAll} />
    </div>
  );
}

/* ============================== KDS: ORDER CARD ============================== */
function OrderCard({ order, now, onAdvance, isNew }) {
  const egg = EGG_OPTIONS.find((e) => e.id === order.eggId);
  const base = BASE_OPTIONS.find((b) => b.id === order.baseId);
  const style = STYLE_OPTIONS.find((s) => s.id === order.styleId);
  const diff = order.pickupTime - now;
  const { overdue, txt } = fmtCountdown(diff);
  const active = order.status === 'pending' || order.status === 'cooking';
  const showUrgent = active && overdue;

  return (
    <div className={`rounded-2xl bg-white border-2 p-4 shadow-sm ${showUrgent ? 'border-red-400 animate-pulseRing' : 'border-charcoal-100'} ${isNew ? 'animate-newcard bg-gradient-to-r from-amber-50 via-amber-100 to-amber-50' : ''}`}>
      <div className="flex items-start justify-between gap-2">
        <div>
          <p className="font-extrabold text-lg leading-tight">{order.id}</p>
          <p className="text-sm text-charcoal-500 flex items-center gap-1"><IconUser size={13} />{order.name}</p>
          <p className="text-xs text-charcoal-400 flex items-center gap-1"><IconPhone size={11} />{order.phone}</p>
        </div>
        {active && (
          <div className={`shrink-0 text-right rounded-xl px-2.5 py-1.5 font-mono font-bold text-sm ${showUrgent ? 'bg-red-100 text-red-600' : 'bg-charcoal-100 text-charcoal-700'}`}>
            <div className="flex items-center gap-1 justify-end"><IconClock size={13} />{overdue ? `-${txt}` : txt}</div>
            <p className="text-[9px] font-normal opacity-70">{overdue ? 'เลยเวลารับแล้ว' : 'ถึงเวลารับ'}</p>
          </div>
        )}
        {order.status === 'ready' && (
          <Pill className="bg-emerald-100 text-emerald-700 shrink-0">พร้อมรับ</Pill>
        )}
        {order.status === 'completed' && (
          <Pill className="bg-charcoal-100 text-charcoal-500 shrink-0">เสร็จสิ้น</Pill>
        )}
      </div>

      <div className="mt-3 rounded-xl bg-amber-50 px-3 py-2 text-sm font-semibold text-amber-800">
        {egg ? egg.label : ''} · {base ? base.label : ''} · <span className="font-extrabold">{style ? style.label : ''}</span>
      </div>

      {order.toppings.length > 0 && (
        <ul className="mt-2 grid grid-cols-2 gap-x-2 gap-y-1">
          {order.toppings.map((id) => {
            const t = TOPPING_MAP[id];
            if (!t) return null;
            return (
              <li key={id} className="flex items-center gap-1.5 text-sm sm:text-base font-medium text-charcoal-700">
                <span className="text-emerald-500"><IconCheck size={14} strokeWidth={3} /></span>
                <span>{t.emoji} {t.name}</span>
              </li>
            );
          })}
        </ul>
      )}

      {order.note && (
        <p className="mt-2 text-sm bg-red-50 text-red-700 rounded-lg px-3 py-2 font-medium">📝 {order.note}</p>
      )}

      {active && (
        <button
          onClick={() => onAdvance(order.id)}
          className={`btn-press w-full mt-3 rounded-xl font-bold py-2.5 text-white ${order.status === 'pending' ? 'bg-orange-500 hover:bg-orange-400' : 'bg-emerald-500 hover:bg-emerald-400'}`}
        >
          {NEXT_LABEL[order.status]} →
        </button>
      )}
      {order.status === 'ready' && (
        <p className="text-center text-xs text-charcoal-400 mt-1">แตะปุ่มด้านบนเมื่อลูกค้ามารับแล้ว</p>
      )}
    </div>
  );
}

/* ============================== KDS: COLUMN ============================== */
function Column({ statusKey, orders, now, onAdvance, newIds }) {
  const meta = STATUS_META[statusKey];
  const toneBg = { amber: 'bg-amber-50 border-amber-200', orange: 'bg-orange-50 border-orange-200', emerald: 'bg-emerald-50 border-emerald-200', slate: 'bg-charcoal-50 border-charcoal-200' }[meta.col];
  return (
    <div className="flex flex-col min-w-[290px] w-[290px] sm:w-full shrink-0">
      <div className={`rounded-t-2xl border-2 border-b-0 px-4 py-3 flex items-center justify-between ${toneBg}`}>
        <p className="font-bold text-sm flex items-center gap-1.5">{meta.emoji} {meta.label}</p>
        <span className="bg-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold">{orders.length}</span>
      </div>
      <div className={`flex-1 border-2 border-t-0 rounded-b-2xl p-2.5 space-y-2.5 min-h-[160px] max-h-[70vh] overflow-y-auto ${toneBg}`}>
        {orders.length === 0 && <p className="text-center text-xs text-charcoal-400 py-8">ไม่มีออเดอร์</p>}
        {orders.map((o) => <OrderCard key={o.id} order={o} now={now} onAdvance={onAdvance} isNew={newIds.has(o.id)} />)}
      </div>
    </div>
  );
}

/* ============================== KITCHEN VIEW ============================== */
function KitchenView({ orders, onAdvance, newIds }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const pending = orders.filter((o) => o.status === 'pending').sort((a, b) => a.pickupTime - b.pickupTime);
  const cooking = orders.filter((o) => o.status === 'cooking').sort((a, b) => a.pickupTime - b.pickupTime);
  const ready = orders.filter((o) => o.status === 'ready').sort((a, b) => a.pickupTime - b.pickupTime);
  const completed = orders.filter((o) => o.status === 'completed').sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)).slice(0, 12);

  return (
    <div className="max-w-7xl mx-auto px-4 py-6">
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <h2 className="text-xl font-extrabold flex items-center gap-2"><IconChefHat size={22} className="text-amber-600" /> Kitchen Display System</h2>
        <p className="text-sm text-charcoal-400">อัปเดตอัตโนมัติทุกวินาที</p>
      </div>
      <div className="flex sm:grid sm:grid-cols-4 gap-4 overflow-x-auto no-scrollbar pb-2">
        <Column statusKey="pending" orders={pending} now={now} onAdvance={onAdvance} newIds={newIds} />
        <Column statusKey="cooking" orders={cooking} now={now} onAdvance={onAdvance} newIds={newIds} />
        <Column statusKey="ready" orders={ready} now={now} onAdvance={onAdvance} newIds={newIds} />
        <Column statusKey="completed" orders={completed} now={now} onAdvance={onAdvance} newIds={newIds} />
      </div>
    </div>
  );
}

/* ============================== ADMIN SLIDE-OVER ============================== */
function AdminPanel({ open, onClose, storeOpen, setStoreOpen, stock, setStock, orders, onReset }) {
  const todayStart = useMemo(() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }, []);
  const todayOrders = orders.filter((o) => o.createdAt >= todayStart);
  const revenue = todayOrders.reduce((s, o) => s + o.total, 0);
  const toppingFreq = useMemo(() => {
    const map = {};
    todayOrders.forEach((o) => o.toppings.forEach((id) => { map[id] = (map[id] || 0) + 1; }));
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [todayOrders]);
  const maxFreq = toppingFreq.length ? toppingFreq[0][1] : 1;

  return (
    <React.Fragment>
      {open && <div className="fixed inset-0 bg-black/50 z-40 animate-fadeIn" onClick={onClose} />}
      <div className={`fixed top-0 right-0 h-full w-full sm:w-[400px] bg-white z-50 shadow-2xl overflow-y-auto transition-transform duration-300 ${open ? 'translate-x-0' : 'translate-x-full'}`}>
        <div className="sticky top-0 bg-white border-b border-charcoal-100 px-5 py-4 flex items-center justify-between z-10">
          <h3 className="font-extrabold text-lg flex items-center gap-2"><IconSettings size={18} /> แผงควบคุมร้าน</h3>
          <button onClick={onClose} className="text-charcoal-400 hover:text-charcoal-700"><IconX size={20} /></button>
        </div>

        <div className="p-5 space-y-6">
          <section className="rounded-2xl border-2 border-charcoal-100 p-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${storeOpen ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}`}>
                {storeOpen ? <IconUnlock size={18} /> : <IconLock size={18} />}
              </div>
              <div>
                <p className="font-bold">{storeOpen ? 'ร้านเปิดอยู่' : 'ร้านปิดอยู่'}</p>
                <p className="text-xs text-charcoal-400">ควบคุมการรับพรีออเดอร์</p>
              </div>
            </div>
            <Switch checked={storeOpen} onChange={setStoreOpen} label="เปิด/ปิดร้าน" />
          </section>

          <section>
            <h4 className="font-bold mb-3 flex items-center gap-2"><IconChart size={17} /> สรุปยอดวันนี้</h4>
            <div className="grid grid-cols-2 gap-3">
              <div className="rounded-2xl bg-amber-50 p-3.5">
                <p className="text-xs text-charcoal-500">ออเดอร์ทั้งหมด</p>
                <p className="text-2xl font-extrabold text-amber-700">{todayOrders.length}</p>
              </div>
              <div className="rounded-2xl bg-emerald-50 p-3.5">
                <p className="text-xs text-charcoal-500">รายได้รวม</p>
                <p className="text-2xl font-extrabold text-emerald-700">{money(revenue)}</p>
              </div>
            </div>
            <div className="mt-3 rounded-2xl border-2 border-charcoal-100 p-3.5">
              <p className="text-xs font-bold text-charcoal-500 uppercase mb-2 flex items-center gap-1.5"><IconTrend size={14} /> ท็อปปิ้งยอดนิยม</p>
              {toppingFreq.length === 0 ? (
                <p className="text-sm text-charcoal-400">ยังไม่มีข้อมูลวันนี้</p>
              ) : (
                <div className="space-y-2">
                  {toppingFreq.map(([id, count]) => {
                    const t = TOPPING_MAP[id];
                    if (!t) return null;
                    return (
                      <div key={id} className="flex items-center gap-2">
                        <span className="text-sm w-24 shrink-0 truncate">{t.emoji} {t.name}</span>
                        <div className="flex-1 h-2.5 bg-charcoal-100 rounded-full overflow-hidden">
                          <div className="h-full bg-amber-400 rounded-full" style={{ width: `${(count / maxFreq) * 100}%` }} />
                        </div>
                        <span className="text-xs font-bold text-charcoal-500 w-5 text-right">{count}</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </section>

          <section>
            <h4 className="font-bold mb-3 flex items-center gap-2"><IconPackage size={17} /> สต๊อกท็อปปิ้ง</h4>
            <div className="space-y-4">
              {TOPPING_CATEGORIES.map((cat) => (
                <div key={cat.key}>
                  <p className="text-xs font-bold text-charcoal-400 uppercase mb-1.5">{cat.emoji} {cat.label}</p>
                  <div className="space-y-1.5">
                    {cat.items.map((it) => (
                      <div key={it.id} className="flex items-center justify-between rounded-xl bg-charcoal-50 px-3 py-2">
                        <span className="text-sm font-medium flex items-center gap-1.5">{it.emoji} {it.name}</span>
                        <Switch checked={stock[it.id] !== false} onChange={(v) => setStock((s) => ({ ...s, [it.id]: v }))} label={`stock-${it.id}`} />
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>

          <section>
            <button onClick={onReset} className="btn-press w-full flex items-center justify-center gap-2 rounded-xl border-2 border-red-200 text-red-600 hover:bg-red-50 font-semibold py-2.5 text-sm">
              <IconRotate size={15} /> รีเซ็ตข้อมูลตัวอย่าง
            </button>
          </section>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ============================== ROOT APP ============================== */
let toastSeq = 1;
function App() {
  const [role, setRole] = useState('customer');
  const [adminOpen, setAdminOpen] = useState(false);
  const [orders, setOrders] = useLocalStorage('ts001_orders', null);
  const [stock, setStock] = useLocalStorage('ts001_stock', null);
  const [storeOpen, setStoreOpen] = useLocalStorage('ts001_storeOpen', true);
  const [toasts, setToasts] = useState([]);
  const [newIds, setNewIds] = useState(new Set());
  const prevCountRef = useRef(null);

  // Seed on first load
  useEffect(() => {
    if (orders === null) setOrders(seedOrders());
    if (stock === null) setStock({ shrimp: false });
  }, []); // eslint-disable-line

  const safeOrders = orders || [];
  const safeStock = stock || {};

  const dismissToast = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);
  const pushToast = useCallback((message, type = 'success', emoji) => {
    const id = toastSeq++;
    setToasts((t) => [...t, { id, message, type, emoji }]);
    setTimeout(() => dismissToast(id), 3200);
  }, [dismissToast]);

  const handlePlaceOrder = useCallback((order) => {
    setOrders((prev) => [...(prev || []), order]);
    pushToast(`สั่งซื้อสำเร็จ! หมายเลขออเดอร์ ${order.id}`, 'success', '🎉');
  }, [setOrders, pushToast]);

  const handleAdvance = useCallback((id) => {
    setOrders((prev) => (prev || []).map((o) => {
      if (o.id !== id) return o;
      const next = NEXT_STATUS[o.status];
      if (!next) return o;
      return { ...o, status: next, completedAt: next === 'completed' ? Date.now() : o.completedAt };
    }));
    pushToast('อัปเดตสถานะออเดอร์แล้ว', 'info', '🔄');
  }, [setOrders, pushToast]);

  const handleReset = useCallback(() => {
    if (window.confirm('รีเซ็ตข้อมูลออเดอร์ตัวอย่างทั้งหมด?')) {
      const seeded = seedOrders();
      setOrders(seeded);
      setStock({ shrimp: false });
      setStoreOpen(true);
      prevCountRef.current = seeded.length;
      pushToast('รีเซ็ตข้อมูลเรียบร้อย', 'info', '🔄');
    }
  }, [setOrders, setStock, setStoreOpen, pushToast]);

  // Detect new pending orders -> highlight + beep (feels like a live KDS)
  useEffect(() => {
    if (orders === null) return;
    if (prevCountRef.current === null) { prevCountRef.current = orders.length; return; }
    if (orders.length > prevCountRef.current) {
      const fresh = orders.slice(prevCountRef.current);
      const ids = new Set(fresh.map((o) => o.id));
      setNewIds(ids);
      playBeep();
      const t = setTimeout(() => setNewIds(new Set()), 3000);
      prevCountRef.current = orders.length;
      return () => clearTimeout(t);
    }
    prevCountRef.current = orders.length;
  }, [orders]);

  const pendingCount = safeOrders.filter((o) => o.status === 'pending').length;

  return (
    <div className="min-h-screen pb-4">
      <NavBar role={role} setRole={setRole} storeOpen={storeOpen} onOpenAdmin={() => setAdminOpen(true)} pendingCount={pendingCount} />

      {role === 'customer' ? (
        <CustomerView storeOpen={storeOpen} stock={safeStock} onPlaceOrder={handlePlaceOrder} toast={pushToast} />
      ) : (
        <KitchenView orders={safeOrders} onAdvance={handleAdvance} newIds={newIds} />
      )}

      <AdminPanel
        open={adminOpen}
        onClose={() => setAdminOpen(false)}
        storeOpen={storeOpen}
        setStoreOpen={(v) => { setStoreOpen(v); pushToast(v ? 'เปิดร้านแล้ว' : 'ปิดร้านแล้ว', v ? 'success' : 'error', v ? '🔓' : '🔒'); }}
        stock={safeStock}
        setStock={setStock}
        orders={safeOrders}
        onReset={handleReset}
      />

      <ToastStack toasts={toasts} dismiss={dismissToast} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
